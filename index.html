<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MorvexxShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 16px;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 16px;
            background: linear-gradient(135deg, #2b5278 0%, #1c3a5c 100%);
            border-radius: 16px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .section-title {
            font-size: 14px;
            opacity: 0.6;
            margin: 16px 0 8px 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #232e3c);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid transparent;
        }

        .card:active {
            transform: scale(0.97);
            background: #2b5278;
            border-color: #3a6a9a;
        }

        .card .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .card .name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card .desc {
            font-size: 12px;
            opacity: 0.6;
        }

        .menu-buttons {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-btn {
            background: var(--tg-theme-secondary-bg-color, #232e3c);
            border: none;
            color: var(--tg-theme-text-color, #ffffff);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .menu-btn:active {
            background: #2b5278;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: var(--tg-theme-bg-color, #17212b);
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2b5278;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛒 MorvexxShop</h1>
        <p>Игровая валюта и подписки</p>
    </div>

    <div class="section-title">Категории</div>
    <div class="grid">
        <div class="card" onclick="openCategory('stars')">
            <span class="emoji">⭐</span>
            <div class="name">Telegram Stars</div>
            <div class="desc">от 100 шт</div>
        </div>
        <div class="card" onclick="openCategory('robux')">
            <span class="emoji">🎮</span>
            <div class="name">Robux</div>
            <div class="desc">от 100 шт</div>
        </div>
        <div class="card" onclick="openCategory('steam')">
            <span class="emoji">💨</span>
            <div class="name">Steam Balance</div>
            <div class="desc">RUB, UAH, USD, EUR</div>
        </div>
        <div class="card" onclick="openCategory('standoff')">
            <span class="emoji">🔫</span>
            <div class="name">Standoff 2 Gold</div>
            <div class="desc">от 100 шт</div>
        </div>
        <div class="card" onclick="openCategory('brawl')">
            <span class="emoji">💎</span>
            <div class="name">Brawl Stars Gems</div>
            <div class="desc">от 100 шт</div>
        </div>
    </div>

    <div class="menu-buttons">
        <button class="menu-btn" onclick="openBot('profile')">
            👤 <span>Профиль</span>
        </button>
        <button class="menu-btn" onclick="openBot('my_orders')">
            🛒 <span>Мои заказы</span>
        </button>
    </div>

    <div class="footer">
        MorvexxShop © 2026
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function openCategory(cat) {
            // Отправляем данные боту через Telegram WebApp API
            if (tg) {
                tg.sendData(JSON.stringify({ action: 'open_category', category: cat }));
            } else {
                showToast('Открой через Telegram!');
            }
        }

        function openBot(action) {
            if (tg) {
                tg.sendData(JSON.stringify({ action: action }));
            } else {
                showToast('Открой через Telegram!');
            }
        }
    </script>
</body>
</html>
